name: golangci-lint

on:
  pull_request:
    branches: ["*"]
    paths: ["**/*.go", "go.*", ".golangci.yml"]
  push:
    branches: ["*"]
    tags-ignore: ["v*"]
    paths: ["**/*.go", "go.*", ".golangci.yml"]
  workflow_dispatch:

jobs:
  golangci-lint:
    name: lint (CGO_ENABLED=${{ matrix.CGO_ENABLED }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        CGO_ENABLED: ["0", "1"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        env:
          CGO_ENABLED: ${{ matrix.CGO_ENABLED }}
